name: Documentation

on:
  push:
    branches:
      - docs
    paths:
      - 'docs_zh/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  build:
    env:
      HUGO_VERSION: 0.160.1
      TZ: Asia/Shanghai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Hugo
        run: |
          curl -L "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin hugo
          hash -r
      - name: Verify installations
        run: |
          echo "Hugo: $(hugo version)"
          echo "Node.js: $(node --version)"
      - name: Fetch Source
        run: |
          git clone https://github.com/docker/docs.git docsite
      - name: Fix
        run: |
          # sed -i 's/refLinksErrorLevel: WARNING/refLinksErrorLevel: ERROR/' docsite/hugo.yaml
          sed -i '/baseURL/d' docsite/hugo.yaml
      - name: Build Docs
        run: |
          cp -r docs_zh/* ./docsite/content
          cd docsite/
          npm install
          hugo build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docsite/public
          retention-days: 1

  deploy-github-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      # - uses: actions/configure-pages@v5
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: ./public
      - name: Deploy to Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: ${{ vars.PAGES_DOMAIN }}
      # - uses: actions/upload-pages-artifact@v4
      #   with:
      #     path: docsite/public
      # - uses: actions/deploy-pages@v4
      #   id: deployment

  deploy-ssh-server:
    needs: build
    runs-on: ubuntu-latest
    # 是否启用 SSH 服务器部署，默认不启用。
    # 在仓库 Settings → Secrets and variables → Actions → Variables 中
    # 添加变量 ENABLE_SSH_DEPLOY=true 即可开启。
    env:
      ENABLE_SSH_DEPLOY: ${{ vars.ENABLE_SSH_DEPLOY || 'false' }}
    if: ${{ vars.ENABLE_SSH_DEPLOY == 'true' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: ./public
      - name: Compress to tar.xz
        run: |
          tar -cJf docs-site.tar.xz public/
      - name: Set up SSH
        uses: LuisEnMarroquin/setup-ssh-action@v3.0.0
        with:
          ORIGIN: ${{ secrets.SSH_HOSTNAME }}
          SSHKEY: ${{ secrets.SSH_KEY }}
          NAME: webserver
          PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.SSH_USERNAME }}
      - run: echo "" >> ~/.ssh/access  # fix
      - name: Deploy the website
        env:
          WEBROOT: /data/wwwroot/docker
        run: |
          ssh webserver "rm -rf $WEBROOT && mkdir -p $WEBROOT"
          scp docs-site.tar.xz webserver:${WEBROOT}/
          ssh webserver "cd $WEBROOT && tar -xJf docs-site.tar.xz --strip-components=1 && rm -f docs-site.tar.xz"
